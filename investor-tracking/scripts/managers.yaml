# Splits and other share-count changes that are not trades. `ratio` is new shares per old
# share (3-for-2 is 1.5); `quarter` is the quarter whose 13F first shows post-split counts.
# diff13f.py multiplies the earlier quarter's share count by the ratio when that quarter
# falls after the earlier one and no later than the later one. Shared across investors,
# since a split hits every holder. diff13f.py also flags share jumps whose implied price
# moved by a split-like ratio, so a missing entry shows up rather than reading as a trade.
corporate_actions:
  - {cusip: 67066G104, issuer: NVIDIA, type: split, ratio: 10, quarter: 2024-Q2, when: "June 2024"}
  - {cusip: 169656105, issuer: Chipotle Mexican Grill, type: split, ratio: 50, quarter: 2024-Q2, when: "June 2024"}
  - {cusip: 67103H107, issuer: "O'Reilly Automotive", type: split, ratio: 15, quarter: 2025-Q2, when: "June 2025"}
  - {cusip: 11271J107, issuer: Brookfield Corp, type: split, ratio: 1.5, quarter: 2025-Q4, when: "paid 2025-10-09"}
  - {cusip: 64110L106, issuer: Netflix, type: split, ratio: 10, quarter: 2025-Q4, when: "November 2025"}
  - {cusip: 81762P102, issuer: ServiceNow, type: split, ratio: 5, quarter: 2025-Q4, when: "late 2025"}
  - {cusip: 09857L108, issuer: Booking Holdings, type: split, ratio: 25, quarter: 2026-Q2, when: "after the close 2026-04-02"}
