# What the scripts need to know about each investor that the filings themselves don't say.
#
# filers_13f   every CIK whose 13F holds this investor's book. `book` names a separate output
#              folder for a second filer whose book should stay apart (Fundsmith's FISL);
#              filers without one are summed into the main book.
# related      other entities whose filings matter: fund trusts (N-PORT, N-CSR) with the
#              series id that is this investor's fund, or `nport: true` for a single-fund
#              filer; private-fund vehicles (Form D); feeders; look-alikes to ignore.
#              watch.py lists their new filings too.
# exclude_from_weights   CUSIPs left in the holdings file (it mirrors the filing) but left
#              out of weights and flow rates in diff13f.py.
# thousands_quarters     quarters the filer reported in thousands of dollars despite the
#              rule (whole dollars since January 2023); build13f.py multiplies them up.
# cusip_aliases          old CUSIP -> current CUSIP for the same security.
# corrections  per-quarter fixes for errors the filer never amended (today: issuer names
#              only), applied by build13f.py and recorded in that investor's log. Keep these
#              rare and sourced.
# accepted_gaps          filings whose own rows don't add up to their cover page, accepted
#              after checking that the gap is the filer's and immaterial. build13f.py refuses
#              any other filing that doesn't reconcile.
#
# CIKs are plain integers. Adding an investor: give it a slug, its 13F filer CIK(s), and
# whatever related entities you find while building its baseline.

investors:
  akre:
    name: Akre Capital Management
    filers_13f:
